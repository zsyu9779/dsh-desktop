name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and publish (for example v0.1.6)
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve a release tag on main
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-22.04
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev pkg-config build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Test
        run: go test ./...

      - name: Smoke test DeepSeek Harness launcher
        if: runner.os == 'Linux'
        run: go test -timeout 4m -tags smoke -run TestDSHManagerReachesReady -v .

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.os }}" in
            macos-latest)
              ditto -c -k --sequesterRsrc --keepParent "build/bin/dsh-desktop.app" "dist/dsh-desktop-darwin-universal.zip"
              ;;
            windows-latest)
              cp build/bin/*.exe dist/
              ;;
            ubuntu-22.04)
              tar -czf dist/dsh-desktop-linux-amd64.tar.gz -C build/bin dsh-desktop
              cp build/bin/*.deb build/bin/*.rpm dist/ 2>/dev/null || true
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  sign-macos:
    needs: [source, build]
    runs-on: macos-latest
    environment: macos-release
    steps:
      # Signing code comes from the workflow revision, even when rebuilding an older tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Test signing and publication gates without credentials
        run: python3 -B -m unittest discover -s scripts/tests -v
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-macos-latest
          path: unsigned
      - name: Unpack the app
        run: ditto -x -k unsigned/dsh-desktop-darwin-universal.zip unsigned/app
      - name: Sign, notarize and package macOS
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/package-macos.sh unsigned/app/dsh-desktop.app dist
      - name: Clean signing material after cancellation or failure
        if: always()
        shell: bash
        run: |
          for signing_dir in "$RUNNER_TEMP"/dsh-signing.*; do
            [[ -d "$signing_dir" ]] || continue
            security delete-keychain "$signing_dir/signing.keychain-db" >/dev/null 2>&1 || true
            rm -rf "$signing_dir"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos-signed
          path: dist/
          if-no-files-found: error

  release:
    needs: [source, build, sign-macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Explicit names prevent the intermediate unsigned macOS ZIP from being published.
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-macos-signed
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-windows-latest
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-ubuntu-22.04
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.source.outputs.tag }}
          files: artifacts/**
          generate_release_notes: true
