<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DeepSeek Harness</title>
</head>
<body>
<div id="app">
    <iframe
        class="harness-frame"
        id="harness-frame"
        title="DeepSeek Harness"
        hidden
    ></iframe>

    <div class="splash" id="splash">
        <div class="brand">
            <div class="logo" aria-hidden="true">
                <span class="logo-mark">DSH</span>
            </div>
            <h1>DeepSeek Harness</h1>
            <p class="tagline">Everything is a Plugin</p>
        </div>

        <div class="status">
            <div class="spinner" id="spinner" aria-hidden="true"></div>
            <p class="status-text" id="status-text">正在启动…</p>
        </div>

        <div class="progress" id="progress" aria-hidden="true"><div class="progress-bar"></div></div>

        <div class="actions actions-ready" id="actions-ready" hidden>
            <button class="btn btn-primary" id="btn-enter">进入桌面界面</button>
        </div>

        <div class="remote" id="remote" hidden>
            <div class="remote-head">
                <span class="remote-title">手机远程</span>
                <button class="btn btn-quiet" id="btn-remote-toggle">开启</button>
            </div>
            <div class="remote-detail" id="remote-detail" hidden>
                <img class="remote-qr" id="remote-qr" alt="配对二维码" />
                <p class="remote-url" id="remote-url"></p>
                <div class="remote-actions">
                    <button class="btn" id="btn-remote-copy">复制地址</button>
                    <button class="btn btn-quiet" id="btn-remote-regen">重新生成配对码</button>
                </div>
                <div class="remote-meta" id="remote-meta" hidden>
                    <p class="remote-fp" id="remote-fp"></p>
                    <label class="remote-allow">
                        <input type="checkbox" id="remote-allow-privileged" />
                        允许远程管理敏感设置（settings / 凭据等）
                    </label>
                </div>
                <div class="remote-devices" id="remote-devices" hidden>
                    <p class="remote-devices-title">已配对设备</p>
                    <ul class="remote-device-list" id="remote-device-list"></ul>
                </div>
            </div>
            <p class="remote-hint">手机与电脑连同一 WiFi，扫码即可在手机上操控 DeepSeek Harness。</p>
        </div>
        <div class="actions" id="actions" hidden>
            <button class="btn btn-primary" id="btn-retry">重试</button>
            <button class="btn" id="btn-node">安装 Node.js</button>
            <button class="btn" id="btn-browser">在浏览器打开</button>
            <button class="btn" id="btn-logs">查看日志</button>
            <button class="btn btn-quiet" id="btn-quit">退出</button>
        </div>

        <pre class="logs" id="logs" hidden></pre>
    </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
